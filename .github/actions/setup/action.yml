name: Set up development tools
description: Select the repository's Node/npm versions and install locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - name: Select npm
      shell: bash
      run: npm install --global npm@12.2.0 --ignore-scripts
      working-directory: ${{ runner.temp }}
    - name: Install dependencies
      shell: bash
      run: npm ci
