name: Feature request
description: Explain a Git browsing workflow you want to improve.
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow and problem
      description: Describe the task you are doing and where the current behavior gets in the way.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the expected interaction. References to an existing VS Code or WebStorm workflow are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: Can a built-in VS Code action or another extension already do part of this?
